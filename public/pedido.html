<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Haz tu pedido — Suspiro 🍰</title>
<link rel="stylesheet" href="style.css" />
<style>
/* Pequeños estilos específicos para pedido */
.pedido-wrap { max-width:1100px; margin:40px auto; padding:0 20px; display:flex; gap:30px; }
.catalog { flex:2; }
.cart { flex:1; position:sticky; top:100px; align-self:flex-start; background:#fff; border-radius:16px; padding:18px; box-shadow:0 8px 30px rgba(0,0,0,0.08); }
.cart h3 { margin-bottom:12px; color:#543d37; }
.product-row { display:flex; gap:15px; align-items:center; background:var(--crema); padding:12px; border-radius:12px; margin-bottom:14px; }
.product-row img{ width:96px; height:72px; object-fit:cover; border-radius:10px; }
.product-row .meta { flex:1; }
.qty { display:flex; gap:8px; align-items:center; }
.qty button { padding:6px 8px; border-radius:10px; border:none; cursor:pointer; background:#f28ab2; color:#fff; font-weight:700; }
.checkout-btn { width:100%; margin-top:12px; padding:12px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
.field { margin-bottom:10px; }
.field input, .field textarea, select { width:100%; padding:10px;border-radius:10px;border:1px solid #eee; }
.small-muted { color:#666; font-size:0.9rem; margin-top:8px; }
.empty { text-align:center; padding:30px 10px; color:#777; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">🍓 <span>Suspiro</span></div>
  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="pedido.html" class="active">Pedidos</a>
    <a href="reseñas.html">Reseñas</a>
  </nav>
</header>

<main>
  <h1 style="text-align:center; margin-top:30px; color:var(--chocolate)">Arma tu pedido</h1>

  <div class="pedido-wrap">
    <!-- Catálogo (se renderiza con JS) -->
    <section class="catalog" id="catalog"></section>

    <!-- Carrito -->
    <aside class="cart" id="cart">
      <h3>🛒 Mi pedido</h3>
      <div id="cartItems"></div>

      <div style="margin-top:12px;">
        <div class="field"><input id="clienteNombre" placeholder="Tu nombre" required></div>
        <div class="field"><input id="clienteTelefono" placeholder="Teléfono o WhatsApp" required></div>
        <div class="field"><select id="metodoEntrega"><option value="retiro">Retiro</option><option value="envio">Envío</option></select></div>
        <div class="field"><textarea id="direccion" placeholder="Dirección (si escoges envío)" rows="2"></textarea></div>
        <div class="field"><textarea id="nota" placeholder="Nota para el pedido (opcional)" rows="2"></textarea></div>

        <div style="display:flex; gap:10px; align-items:center;">
          <div style="flex:1;"><strong>Total:</strong> <span id="total">$0</span></div>
        </div>

        <button id="checkout" class="checkout-btn">Enviar pedido</button>
        <p class="small-muted">Recibirás confirmación en el teléfono o por correo (según lo que dejes).</p>
      </div>
    </aside>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
